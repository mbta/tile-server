name: Will it build?

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "38 17 * * 2"

jobs:

  build:
    name: Build and test Docker image
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --use-openssl-ca

    steps:
    - name: Update runner CA certificates
      run: |
        sudo apt-get update
        sudo apt-get install --only-upgrade -y ca-certificates
        dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" ge 20260816ubuntu0.24.04.1
    - uses: actions/checkout@v6
    - name: Build Docker image
      run: docker build --pull -t tile-server .
    - name: Run rendering and projection tests
      run: docker run --entrypoint python3 --volume "$PWD:/workspace:ro" --workdir /workspace tile-server -m unittest discover -s tests
