name: Will it build?

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "38 17 * * 2"

jobs:

  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - run: docker build -t tile-server .
    - run: docker run --entrypoint python3 --volume "$PWD:/workspace:ro" --workdir /workspace tile-server -m unittest discover -s tests
